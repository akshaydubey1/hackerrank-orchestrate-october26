name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (OCR, PDF text)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Python dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Predict all 518 requests with fresh extraction
        run: python code/main.py --no-cache --out /tmp/output.csv --trace-dir /tmp/runs
      - name: Committed output.csv matches a fresh prediction
        run: cmp output.csv /tmp/output.csv
      - name: Samples, synthetic cases, verifier and verifier-defect fixtures
        run: |
          python code/evaluation/main.py --quick --out /tmp/evaluation_report.md --json /tmp/evaluation_results.json
          python - <<'PY'
          import json, sys
          r = json.load(open("/tmp/evaluation_results.json"))
          fx = [n for n, ok, _ in r["fixtures"] if not ok]
          vd = [x[0] for x in r["verifier_defects"] if not x[3]]
          c = r["contract"]
          print("fixtures failing:", fx, "| verifier defects missed:", vd, "| contract errors:", c.get("errors"))
          sys.exit(1 if fx or vd or c.get("errors") or not c.get("matches_fresh_prediction") else 0)
          PY
